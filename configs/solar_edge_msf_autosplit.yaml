project_name: solar_edge_msf_autosplit

data:
  # Use this when your dataset only has one images folder and one masks folder.
  train_images: /path/to/dataset/images
  train_masks: /path/to/dataset/masks
  val_images: null
  val_masks: null
  test_images: null
  test_masks: null
  image_size: 512
  mask_threshold: 127
  val_ratio: 0.2
  mean: [0.5]
  std: [0.5]

model:
  name: SolarEdgeMSFNet
  in_channels: 1
  num_classes: 1
  base_channels: 32
  depths: [2, 2, 4, 2]
  drop_path_rate: 0.10
  deep_supervision: true

loss:
  bce_weight: 0.50
  dice_weight: 0.50
  seg_pos_weight: 2.5
  seg_weight: 1.0
  edge_weight: 0.20
  edge_pos_weight: 3.0
  aux_weight: 0.30

loader:
  batch_size: 8
  num_workers: 4

optim:
  lr: 0.0003
  min_lr: 0.000001
  weight_decay: 0.0001

train:
  epochs: 120
  seed: 42
  amp: true
  grad_clip: 1.0
  early_stopping_patience: 20
  output_dir: ./outputs/solar_edge_msf_autosplit

eval:
  threshold: 0.5
  selection_metric: iou
