project_name: solar_topo_crack_v2p1_py36

data:
  train_images: ./cnn-elpv-dataset/solar_defect_seg/data/PVEL_S/train/defect
  train_masks: ./cnn-elpv-dataset/solar_defect_seg/data/PVEL_S/train/label
  val_images: ./cnn-elpv-dataset/solar_defect_seg/data/PVEL_S/val/defect
  val_masks: ./cnn-elpv-dataset/solar_defect_seg/data/PVEL_S/val/label
  test_images: ./cnn-elpv-dataset/solar_defect_seg/data/PVEL_S/test/defect
  test_masks: ./cnn-elpv-dataset/solar_defect_seg/data/PVEL_S/test/label

  image_size: 512
  mask_threshold: 127
  val_ratio: 0.2
  mean: [0.5]
  std: [0.5]

model:
  name: SolarTopoCrackV2P1Net
  in_channels: 1
  num_classes: 1
  base_channels: 32
  depths: [2, 2, 4, 2]
  drop_path_rate: 0.10
  deep_supervision: true
  spectral_cutoff: 0.16

loss:
  bce_weight: 0.50
  dice_weight: 0.50
  seg_pos_weight: 2.5
  boundary_boost: 2.5
  ohem_ratio: 0.35
  ohem_min_kept: 4096
  focal_gamma: 0.0

  seg_weight: 1.0
  edge_weight: 0.15
  topo_weight: 0.20
  consistency_weight: 0.10
  aux_weight: 0.25
  coarse_weight: 0.20

  edge_pos_weight: 3.0
  topo_bce_weight: 0.5
  topo_dice_weight: 0.4
  topo_cldice_weight: 0.2
  cldice_iters: 10
  topo_warmup_epochs: 8
  topo_pos_weight: 4.0

  cons_boundary_weight: 0.50
  cons_inside_weight: 1.00
  cons_anti_edge_weight: 0.25

loader:
  batch_size: 8
  num_workers: 4

optim:
  lr: 0.0003
  min_lr: 0.000001
  weight_decay: 0.0001

train:
  epochs: 120
  seed: 42
  amp: true
  data_parallel: true
  grad_clip: 1.0
  early_stopping_patience: 20
  output_dir: ./outputs/solar_topo_crack_v2p1_py36

eval:
  threshold: 0.5
  auto_threshold: true
  threshold_candidates: [0.35, 0.40, 0.45, 0.50, 0.55]
  selection_metric: iou
